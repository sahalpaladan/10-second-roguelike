<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Second Roguelike</title>
    <!-- Include Phaser 3 Game Engine Framework -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.86.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<script>
    // Game Configuration
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);

    // Global Game Variables
    let player;
    let cursors;
    let wasd;
    let enemies;
    let spawnTimer;
    let countdownTimer;
    
    let timeLeft = 10.0;
    let score = 0;
    let isGameOver = false;

    // UI Elements
    let timerText;
    let scoreText;
    let gameOverText;

    function preload() {
        // No external assets required! We generate shapes dynamically using Graphics objects.
    }

    function create() {
        // Reset state variables for fresh games
        timeLeft = 10.0;
        score = 0;
        isGameOver = false;

        // 1. Create Player Visual Asset (32x32 Neon Green Square)
        let playerGraphics = this.make.graphics({ x: 0, y: 0, add: false });
        playerGraphics.fillStyle(0x00ff66, 1);
        playerGraphics.fillRect(0, 0, 32, 32);
        playerGraphics.generateTexture('playerTexture', 32, 32);

        // 2. Create Enemy Visual Asset (24x24 Crimson Red Circle)
        let enemyGraphics = this.make.graphics({ x: 0, y: 0, add: false });
        enemyGraphics.fillStyle(0xff3333, 1);
        enemyGraphics.fillCircle(12, 12, 12);
        enemyGraphics.generateTexture('enemyTexture', 24, 24);

        // 3. Instantiate Physics Player
        player = this.physics.add.sprite(400, 300, 'playerTexture');
        player.setCollideWorldBounds(true);

        // 4. Set Up Controls (Arrow Keys + WASD support)
        cursors = this.input.keyboard.createCursorKeys();
        wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // 5. Enemy Group Handling
        enemies = this.physics.add.group();

        // Spawn one initial enemy
        spawnEnemy.call(this);

        // Spawn a new enemy every 1.5 seconds
        spawnTimer = this.time.addEvent({
            delay: 1500,
            callback: spawnEnemy,
            callbackScope: this,
            loop: true
        });

        // 6. Core Game Loop Countdown Tick (Every 100ms updates timer)
        countdownTimer = this.time.addEvent({
            delay: 100,
            callback: () => {
                if (!isGameOver) {
                    timeLeft -= 0.1;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        triggerGameOver.call(this);
                    }
                }
            },
            callbackScope: this,
            loop: true
        });

        // 7. Collision Logic: Player overlaps Enemy
        this.physics.add.overlap(player, enemies, defeatEnemy, null, this);

        // 8. User Interface Display Text
        timerText = this.add.text(20, 20, 'TIME: 10.0s', { fontSize: '28px', fill: '#00ff66', fontStyle: 'bold' });
        scoreText = this.add.text(620, 20, 'SCORE: 0', { fontSize: '28px', fill: '#ffffff', fontStyle: 'bold' });
        
        gameOverText = this.add.text(400, 300, '', { fontSize: '40px', fill: '#ff3333', fontStyle: 'bold' }).setOrigin(0.5);
    }

    function update() {
        if (isGameOver) return;

        // Update HUD Values
        timerText.setText(`TIME: ${timeLeft.toFixed(1)}s`);
        scoreText.setText(`SCORE: ${score}`);

        // Change timer color to red warning flash when low on time
        if (timeLeft <= 3.0) {
            timerText.setFill('#ff3333');
        } else {
            timerText.setFill('#00ff66');
        }

        // --- Player Movement Logic ---
        const speed = 250;
        player.setVelocity(0);

        if (cursors.left.isDown || wasd.left.isDown) {
            player.setVelocityX(-speed);
        } else if (cursors.right.isDown || wasd.right.isDown) {
            player.setVelocityX(speed);
        }

        if (cursors.up.isDown || wasd.up.isDown) {
            player.setVelocityY(-speed);
        } else if (cursors.down.isDown || wasd.down.isDown) {
            player.setVelocityY(speed);
        }

        // --- Enemy AI Tracking Logic ---
        enemies.getChildren().forEach((enemy) => {
            // Calculate vector direction towards player coordinates
            this.physics.moveToObject(enemy, player, 120);
        });
    }

    function spawnEnemy() {
        if (isGameOver) return;

        // Generate coordinates along random boundary edges to avoid spawning directly on top of player
        let x, y;
        if (Math.random() > 0.5) {
            x = Math.random() > 0.5 ? 0 : 800;
            y = Math.random() * 600;
        } else {
            x = Math.random() * 800;
            y = Math.random() > 0.5 ? 0 : 600;
        }

        let enemy = enemies.create(x, y, 'enemyTexture');
        enemy.setCollideWorldBounds(true);
    }

    function defeatEnemy(player, enemy) {
        if (isGameOver) return;

        // Erase enemy instance from scene
        enemy.destroy();

        // Apply reward loops
        score += 10;
        timeLeft += 1.5; // Gain bonus time per kill!
        
        // Cap the max timer bonus layout to keep the screen competitive
        if (timeLeft > 10.0) {
            timeLeft = 10.0;
        }
    }

    function triggerGameOver() {
        isGameOver = true;
        player.setVelocity(0);
        enemies.clear(true, true);
        spawnTimer.destroy();
        countdownTimer.destroy();

        gameOverText.setText(`GAME OVER\nFinal Score: ${score}\n\nClick Screen to Restart`);
        
        // Listen for user click to reboot scene sequence
        this.input.once('pointerdown', () => {
            this.scene.restart();
        });
    }
</script>

</body>
</html>
