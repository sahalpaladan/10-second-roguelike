<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Second Survival</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);

    let player;
    let star;
    let enemies;
    let cursors;
    let wasd;
    let spawnTimer;
    let countdownTimer;
    
    let timeLeft = 10.0;
    let score = 0;
    let isGameOver = false;

    let timerText;
    let scoreText;
    let gameOverText;

    function preload() {}

    function create() {
        timeLeft = 10.0;
        score = 0;
        isGameOver = false;

        // 1. Create Green Player Square
        let playerGraphics = this.make.graphics({ x: 0, y: 0, add: false });
        playerGraphics.fillStyle(0x00ff66, 1);
        playerGraphics.fillRect(0, 0, 32, 32);
        playerGraphics.generateTexture('playerTexture', 32, 32);

        // 2. Create Red Enemy Circle
        let enemyGraphics = this.make.graphics({ x: 0, y: 0, add: false });
        enemyGraphics.fillStyle(0xff3333, 1);
        enemyGraphics.fillCircle(12, 12, 12);
        enemyGraphics.generateTexture('enemyTexture', 24, 24);

        // 3. Create Yellow Star Circle (The Objective!)
        let starGraphics = this.make.graphics({ x: 0, y: 0, add: false });
        starGraphics.fillStyle(0xffcc00, 1);
        starGraphics.fillCircle(10, 10, 10);
        starGraphics.generateTexture('starTexture', 20, 20);

        // Spawn Player in Center
        player = this.physics.add.sprite(400, 300, 'playerTexture');
        player.setCollideWorldBounds(true);

        // Spawn First Gold Star randomly
        star = this.physics.add.sprite(Phaser.Math.Between(100, 700), Phaser.Math.Between(100, 500), 'starTexture');

        // Setup Controls
        cursors = this.input.keyboard.createCursorKeys();
        wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        enemies = this.physics.add.group();

        // Spawn a chasing bubble every 1.5 seconds to build difficulty
        spawnEnemyExternal(this);
        spawnTimer = this.time.addEvent({
            delay: 1500,
            callback: () => spawnEnemyExternal(this),
            loop: true
        });

        // Global Countdown Clock
        countdownTimer = this.time.addEvent({
            delay: 100,
            callback: () => {
                if (!isGameOver) {
                    timeLeft -= 0.1;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        triggerGameOver(this);
                    }
                }
            },
            loop: true
        });

        // COLLISION 1: Player hits Gold Star (Good! Gives Points & Time)
        this.physics.add.overlap(player, star, collectStar, null, this);

        // COLLISION 2: Player hits Red Bubble (Bad! Hurts you)
        this.physics.add.overlap(player, enemies, hitEnemy, null, this);

        // Setup Interface Texts
        timerText = this.add.text(20, 20, 'TIME: 10.0s', { fontSize: '28px', fill: '#00ff66', fontStyle: 'bold' });
        scoreText = this.add.text(620, 20, 'SCORE: 0', { fontSize: '28px', fill: '#ffffff', fontStyle: 'bold' });
        gameOverText = this.add.text(400, 300, '', { fontSize: '40px', fill: '#ff3333', fontStyle: 'bold', align: 'center' }).setOrigin(0.5);
    }

    function update() {
        if (isGameOver) return;

        timerText.setText(`TIME: ${timeLeft.toFixed(1)}s`);
        scoreText.setText(`SCORE: ${score}`);

        if (timeLeft <= 3.0) {
            timerText.setFill('#ff3333');
        } else {
            timerText.setFill('#00ff66');
        }

        // Move Player via Keyboard Input
        const speed = 300;
        player.setVelocity(0);

        if (cursors.left.isDown || wasd.left.isDown) player.setVelocityX(-speed);
        else if (cursors.right.isDown || wasd.right.isDown) player.setVelocityX(speed);

        if (cursors.up.isDown || wasd.up.isDown) player.setVelocityY(-speed);
        else if (cursors.down.isDown || wasd.down.isDown) player.setVelocityY(speed);

        // Enemy AI Homing System
        enemies.getChildren().forEach((enemy) => {
            this.physics.moveToObject(enemy, player, 120);
        });
    }

    function spawnEnemyExternal(sceneContext) {
        if (isGameOver) return;
        let x = Math.random() > 0.5 ? 30 : 770;
        let y = Phaser.Math.Between(30, 570);
        let enemy = enemies.create(x, y, 'enemyTexture');
        enemy.setCollideWorldBounds(true);
    }

    // Triggered when player manually runs over a Yellow Star
    function collectStar(playerRef, starRef) {
        if (isGameOver) return;
        
        score += 10;
        timeLeft += 2.5; // Gain bonus survival time!
        if (timeLeft > 10.0) timeLeft = 10.0;

        // Teleport the star to a new random location on screen
        starRef.setPosition(Phaser.Math.Between(100, 700), Phaser.Math.Between(100, 500));
    }

    // Triggered if a Red Bubble catches the player
    function hitEnemy(playerRef, enemyRef) {
        if (isGameOver) return;

        enemyRef.destroy(); // Remove the bubble that hit you
        timeLeft -= 2.0;    // Penalty: Lose 2 seconds instantly!
        
        // Visual indicator flash effect
        playerRef.setTint(0xff0000);
        this.time.delayedCall(150, () => playerRef.clearTint());

        if (timeLeft <= 0) {
            timeLeft = 0;
            triggerGameOver(this);
        }
    }

    function triggerGameOver(sceneContext) {
        isGameOver = true;
        player.setVelocity(0);
        enemies.clear(true, true);
        spawnTimer.destroy();
        countdownTimer.destroy();

        gameOverText.setText(`GAME OVER\nFinal Score: ${score}\n\nClick Screen to Restart`);
        
        sceneContext.input.once('pointerdown', () => {
            sceneContext.scene.restart();
        });
    }
</script>

</body>
</html>
