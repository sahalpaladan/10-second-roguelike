<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Second Arcade Survival</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            background-color: #222;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border-radius: 6px;
            cursor: crosshair;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game Objects and States
    let player = { x: 400, y: 300, size: 30, speed: 5 };
    let star = { x: 200, y: 200, size: 10 };
    let enemies = [];
    let bullets = [];
    let particles = [];
    
    let score = 0;
    let timeLeft = 10.0;
    let isGameOver = false;
    let spawnCounter = 0;
    let flashTimer = 0;
    let screenShake = 0;

    // Input Handlers
    const keys = {};
    window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

    // Shooting / Restart Click Event
    window.addEventListener("mousedown", e => {
        if (isGameOver) {
            player = { x: 400, y: 300, size: 30, speed: 5 };
            enemies = []; bullets = []; particles = [];
            score = 0; timeLeft = 10.0; isGameOver = false;
            moveStarRandomly();
            return;
        }

        const rect = canvas.getBoundingClientRect();
        const mX = e.clientX - rect.left;
        const mY = e.clientY - rect.top;
        const pCX = player.x + player.size / 2;
        const pCY = player.y + player.size / 2;
        const angle = Math.atan2(mY - pCY, mX - pCX);

        bullets.push({
            x: pCX, y: pCY,
            vx: Math.cos(angle) * 8,
            vy: Math.sin(angle) * 8,
            size: 4
        });
        createExplosion(pCX, pCY, "#00ff66", 3, 2);
    });

    function moveStarRandomly() {
        star.x = Math.floor(Math.random() * 600) + 100;
        star.y = Math.floor(Math.random() * 400) + 100;
    }

    function spawnEnemy() {
        let x = Math.random() > 0.5 ? 20 : 780;
        let y = Math.random() * 560 + 20;
        let speedMod = Math.min(1.5, score * 0.005);
        enemies.push({ x: x, y: y, radius: 11, speed: 2.0 + speedMod });
    }

    function createExplosion(x, y, color, count = 8, maxSpeed = 4) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * maxSpeed,
                vy: (Math.random() - 0.5) * maxSpeed,
                alpha: 1, size: Math.random() * 3 + 1, color: color
            });
        }
    }

    // Initialize Game Objects
    moveStarRandomly();
    spawnEnemy();

    // Game Loop
    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        if (isGameOver) return;

        timeLeft -= 1 / 60;
        if (timeLeft <= 0) {
            timeLeft = 0; isGameOver = true; screenShake = 15;
        }

        if (flashTimer > 0) flashTimer--;
        if (screenShake > 0) screenShake *= 0.9;

        // Player Movement
        if (keys["w"] || keys["arrowup"]) player.y -= player.speed;
        if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
        if (keys["a"] || keys["arrowleft"]) player.x -= player.speed;
        if (keys["d"] || keys["arrowright"]) player.x += player.speed;

        // Screen Boundaries check
        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
        if (player.y < 0) player.y = 0;
        if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;

        // Spawn Interval Logic (Spawns faster as score goes up)
        spawnCounter++;
        let rate = Math.max(35, 90 - (score * 0.3));
        if (spawnCounter >= rate) {
            spawnEnemy(); spawnCounter = 0;
        }

        // Move Bullets
        for (let b = bullets.length - 1; b >= 0; b--) {
            let bullet = bullets[b];
            bullet.x += bullet.vx; bullet.y += bullet.vy;
            if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                bullets.splice(b, 1);
            }
        }

        // Move Particles
        for (let p = particles.length - 1; p >= 0; p--) {
            let part = particles[p];
            part.x += part.vx; part.y += part.vy; part.alpha -= 0.03;
            if (part.alpha <= 0) particles.splice(p, 1);
        }

        // Enemies Tracking Logic and Collision Checks
        for (let e = enemies.length - 1; e >= 0; e--) {
            let enemy = enemies[e];
            let pCX = player.x + player.size / 2;
            let pCY = player.y + player.size / 2;
            let dx = pCX - enemy.x;
            let dy = pCY - enemy.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 0) {
                enemy.x += (dx / dist) * enemy.speed;
                enemy.y += (dy / dist) * enemy.speed;
            }

            // Player Damage Collision
            if (enemy.x > player.x && enemy.x < player.x + player.size &&
                enemy.y > player.y && enemy.y < player.y + player.size) {
                timeLeft -= 2.5; flashTimer = 8; screenShake = 12;
                createExplosion(enemy.x, enemy.y, "#ff3333", 10, 5);
                enemies.splice(e, 1);
                continue;
            }

            // Bullet Hit Collision
            for (let b = bullets.length - 1; b >= 0; b--) {
                let bullet = bullets[b];
                let bDx = bullet.x - enemy.x;
                let bDy = bullet.y - enemy.y;
                let bDist = Math.sqrt(bDx * bDx + bDy * bDy);

                if (bDist < enemy.radius + bullet.size) {
                    createExplosion(enemy.x, enemy.y, "#ffaa33", 12, 4);
                    screenShake = Math.max(screenShake, 3);
                    enemies.splice(e, 1);
                    bullets.splice(b, 1);
                    score += 5;
                    break;
                }
            }
        }

        // Star Collection Collision
        let pCX = player.x + player.size / 2;
        let pCY = player.y + player.size / 2;
        let sDist = Math.sqrt(Math.pow(pCX - star.x, 2) + Math.pow(pCY - star.y, 2));

        if (sDist < player.size / 2 + star.size) {
            score += 15; timeLeft += 3.0;
            if (timeLeft > 10.0) timeLeft = 10.0;
            createExplosion(star.x, star.y, "#ffcc00", 15, 3);
            moveStarRandomly();
        }
    }

    function render() {
        ctx.save();
        if (screenShake > 0.5) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        // Background Draw
        ctx.fillStyle = flashTimer > 0 ? "#5a1111" : "#222222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player Draw
        ctx.fillStyle = "#00ff66";
        ctx.fillRect(player.x, player.y, player.size, player.size);

        // Star Draw
        ctx.fillStyle = "#ffcc00";
        ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();

        // Bullets Draw
        ctx.lineWidth = 3; ctx.strokeStyle = "#00ffff";
        bullets.forEach(b => {
            ctx.beginPath(); ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 1.5, b.y - b.vy * 1.5); ctx.stroke();
        });

        // Enemies Draw
        enemies.forEach(e => {
            ctx.fillStyle = "#ff3333"; ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ff9999"; ctx.beginPath();
            ctx.arc(e.x - 2, e.y - 2, e.radius * 0.4, 0, Math.PI * 2); ctx.fill();
        });

        // Particles Draw
        particles.forEach(p => {
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
        });

        // HUD Text Draw
        ctx.font = "bold 24px Arial";
        ctx.fillStyle = timeLeft <= 3.0 ? "#ff3333" : "#00ff66";
        ctx.fillText(`TIME: ${Math.max(0, timeLeft).toFixed(1)}s`, 20, 40);
        ctx.fillStyle = "#ffffff"; ctx.fillText(`SCORE: ${score}`, 630, 40);

        // Game Over Overlay
        if (isGameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 46px Arial"; ctx.fillStyle = "#ff3333"; ctx.textAlign = "center";
            ctx.fillText("MISSION FAILED", 400, 240);
            ctx.font = "24px Arial"; ctx.fillStyle = "#ffffff";
            ctx.fillText(`Final High Score: ${score}`, 400, 290);
            ctx.fillStyle = "#00ffff";
            ctx.fillText("Click Anywhere to Restart", 400, 360);
            ctx.textAlign = "left";
        }
        ctx.restore();
    }

    gameLoop();
</script>

</body>
</html>
